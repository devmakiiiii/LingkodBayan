<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - LingkodBayan</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #080a0b;
          color: #f5f5f5;
        }
      }
      .card {
        max-width: 420px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        opacity: 0.8;
        margin: 0 0 20px;
      }
      button {
        background: #078805;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 10px 24px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #067704;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/lingkod-logo.png" alt="LingkodBayan logo" />
      <h1>You're offline</h1>
      <p>
        It looks like you don't have an internet connection right now. Please check your network
        and try again.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
