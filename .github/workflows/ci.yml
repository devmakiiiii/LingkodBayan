name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Node 20 is EOL and too old for this repo's toolchain: pnpm 11 needs
      # >= 22.13 (it crashes on Node 20 with ERR_UNKNOWN_BUILTIN_MODULE:
      # node:sqlite, which made `cache: pnpm` fail during setup-node), and
      # `node --test "lib/**/*.test.ts"` needs Node >= 22.18 to run the .ts
      # test files without a transpiler.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: |
          LOG=/tmp/unit-tests.log
          echo "node $(node --version)"
          if pnpm test > "$LOG" 2>&1; then
            tail -n 12 "$LOG"
            exit 0
          fi
          # TODO(ci-diagnostic): temporary — surface the failure in a public
          # annotation so it can be read without workflow:read permission.
          tail -c 2000 "$LOG" | tr '\r\n' '  ' | sed 's/%/%25/g' > /tmp/tail.txt
          echo "::error::unit tests failed on node $(node --version) :: $(cat /tmp/tail.txt)"
          exit 1

      - name: Production build
        run: pnpm build
        env:
          # The build only needs the public config to resolve; real secrets
          # live in the deployment environment (Vercel), not CI.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
