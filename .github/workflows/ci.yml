name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Node 20 is EOL and too old for this repo's toolchain: pnpm 11 needs
      # >= 22.13 and crashes on Node 20 with ERR_UNKNOWN_BUILTIN_MODULE:
      # node:sqlite, which made `cache: pnpm` fail inside setup-node and
      # skipped every subsequent check. Node 22 also runs the
      # `node --test "lib/**/*.test.ts"` suite natively (type stripping),
      # so no transpiler step is needed before it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          # The build only needs the public config to resolve; real secrets
          # live in the deployment environment (Vercel), not CI.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
